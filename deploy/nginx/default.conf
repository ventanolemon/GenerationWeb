# Единственная дверь снаружи.
#
# Топология (docs/architecture/system_topology.md §6) держится на том, что
# generator_service и contour_service — ПРИВАТНАЯ сеть: личность приходит
# к ним заголовками `X-User-Id`/`X-User-Role`, которые ставит web_layer
# после проверки сессии. Если бы браузер мог достучаться до :8000 напрямую,
# он ставил бы эти заголовки сам — и роль перестала бы что-либо значить.
#
# Поэтому наружу торчит только этот сервер, и из него наружу ведёт ровно
# два пути: статика клиента и `/api` в web_layer. Портов служб в
# `docker-compose.yml` тоже нет — заслон стоит с обеих сторон.

upstream web_layer {
    server web:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Выгрузка вариантов — это .docx на несколько десятков заданий с
    # картинками; дефолтный лимит в 1 МБ её обрежет. Ответы с записью
    # голоса приходят тем же путём и тоже не помещаются в мегабайт.
    client_max_body_size 32m;

    # ── Клиент ───────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Сборка Vite складывает хэш в имя файла, поэтому её можно кэшировать
    # навсегда. `index.html` — нельзя: он и есть то, что назначает версию.
    location /assets/ {
        # Один заголовок, а не `expires` плюс `add_header`: та пара шлёт
        # ДВА `Cache-Control` в одном ответе, и какой из них возьмёт клиент
        # — уже не наше решение. Проверено curl'ом: заголовок приходил
        # дважды.
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    location / {
        # SPA: неизвестный путь — это маршрут клиента, а не отсутствующий
        # файл. Отдаём index.html и даём разбираться роутеру.
        try_files $uri $uri/ /index.html;
    }

    # ── API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://web_layer;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Заголовки личности снаружи не пропускаем. Личность заверяется
        # `Authorization: Bearer` — по нему служба сама смотрит, кто это и
        # какая у него роль; `X-User-*` рядом с этим — просто заявление
        # клиента о себе, и раньше его хватало, чтобы назначить себя
        # админом. Пустая строка убирает заголовок из запроса к upstream'у.
        #
        # Это связано с `GEN_TRUST_IDENTITY_HEADERS` на стороне службы:
        # переходный режим для необновлённых десктопов, в этом развёртывании
        # ВЫКЛЮЧЕН (см. `.env.example`). Если его придётся включить, снимать
        # заголовки здесь тоже придётся перестать — и тогда роль в системе
        # снова назначает тот, кто её присылает. Половины у этой пары нет:
        # либо оба выключены, либо оба включены и дыра открыта осознанно.
        proxy_set_header X-User-Id   "";
        proxy_set_header X-User-Role "";

        # Прогон графа при `approve` в контуре идёт синхронно и занимает
        # минуты: дефолтные 60 секунд обрывают его на середине.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Проба живости для оркестратора: не ходит ни в одну службу, отвечает
    # сам. Это намеренно — проба должна говорить про ЭТОТ узел.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
